<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Organizer - Milestone List</title>
    <script>
        tailwind = {
            config: {
                darkMode: 'class'
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html.dark {
            color-scheme: dark;
        }
        html.dark body {
            background-color: #0b1120;
            color: #f1f5f9;
        }
        html.dark input, html.dark select, html.dark textarea {
            background-color: #1e293b;
            color: #f8fafc;
            border-color: #334155;
        }
        html.dark option {
            background-color: #1e293b;
            color: #f8fafc;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans min-h-screen flex flex-col transition-colors duration-200">
    <nav class="bg-blue-600 dark:bg-gray-800 text-white p-4 shadow-md mb-6 transition-colors">
        <div class="container mx-auto flex flex-wrap justify-between items-center max-w-5xl gap-4">
            <div class="font-bold text-xl flex items-center gap-2">
                <span>🚀</span> <span>GitHub Organizer</span>
            </div>
            <div class="flex items-center space-x-4 text-sm md:text-base">
                <a href="/" class="hover:text-blue-200 dark:hover:text-blue-400" data-i18n="nav.list">Lista Geral</a>
                <a href="/kanban.html" class="hover:text-blue-200 dark:hover:text-blue-400" data-i18n="nav.kanban">Kanban (Prioridades)</a>
                <a href="/milestones.html" class="font-bold underline decoration-2 underline-offset-4 text-white" data-i18n="nav.milestones">Milestones</a>
                <a href="/dashboard.html" class="hover:text-blue-200 dark:hover:text-blue-400" data-i18n="nav.dashboard">Dashboard Gestor</a>
                <a href="/analytics.html" class="hover:text-blue-200 dark:hover:text-blue-400" data-i18n="nav.analytics">Gráficos & Métricas</a>

                <!-- Seletor de Idioma -->
                <div id="i18n-switcher" class="flex items-center gap-1 text-xs font-bold px-2 py-1 rounded-lg bg-blue-700 dark:bg-gray-700"></div>

                <!-- Toggle Dark Mode -->
                <button id="theme-toggle" onclick="toggleDarkMode()" class="p-2 rounded-lg bg-blue-700 dark:bg-gray-700 hover:bg-blue-800 dark:hover:bg-gray-600 text-yellow-300 dark:text-yellow-400 text-xs focus:outline-none" data-i18n-title="nav.theme.title" title="Alternar Modo Escuro">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-5xl flex-1">
        <div class="mb-4">
            <a href="/milestones.html" class="text-blue-600 dark:text-blue-400 hover:underline text-xs font-semibold flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> <span data-i18n="mslist.back">Voltar para Quadro de Milestones</span>
            </a>
        </div>

        <h1 id="milestone-title" class="text-2xl font-extrabold mb-4 text-gray-900 dark:text-white" data-i18n="mslist.loading.title">Carregando Milestone...</h1>
        <div id="loading" class="text-blue-600 dark:text-blue-400 font-semibold mb-4 flex items-center gap-2">
            <i class="fa-solid fa-spinner fa-spin"></i> <span data-i18n="mslist.loading.issues">Buscando issues...</span>
        </div>

        <div class="bg-white dark:bg-gray-800 shadow-sm rounded-xl overflow-x-auto border border-gray-200 dark:border-gray-700">
            <table class="min-w-full w-full table-auto text-xs" id="issuesTable" style="display: none;">
                <thead>
                    <tr class="bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 uppercase tracking-wider font-bold">
                        <th class="py-3 px-4 text-left w-16" data-i18n="mslist.col.issue">Issue</th>
                        <th class="py-3 px-4 text-left" data-i18n="mslist.col.title">Título</th>
                        <th class="py-3 px-4 text-center w-28" data-i18n="mslist.col.type">Tipo</th>
                        <th class="py-3 px-4 text-center w-36" data-i18n="mslist.col.priority">Prioridade Atual</th>
                        <th class="py-3 px-4 text-center w-48" data-i18n="mslist.col.changePriority">Alterar Prioridade</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 dark:divide-gray-700/60" id="issuesBody">
                    <!-- Conteúdo gerado via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        window.PAGE_I18N = {
            pt: {
                'nav.list': 'Lista Geral',
                'nav.kanban': 'Kanban (Prioridades)',
                'nav.milestones': 'Milestones',
                'nav.dashboard': 'Dashboard Gestor',
                'nav.analytics': 'Gráficos & Métricas',
                'nav.theme.title': 'Alternar Modo Escuro',
                'mslist.back': 'Voltar para Quadro de Milestones',
                'mslist.loading.title': 'Carregando Milestone...',
                'mslist.loading.issues': 'Buscando issues...',
                'mslist.col.issue': 'Issue',
                'mslist.col.title': 'Título',
                'mslist.col.type': 'Tipo',
                'mslist.col.priority': 'Prioridade Atual',
                'mslist.col.changePriority': 'Alterar Prioridade',
                'mslist.none.selected': 'Nenhum milestone selecionado',
                'mslist.title.number': 'Milestone #{id}',
                'mslist.empty': 'Nenhuma issue neste milestone.',
                'mslist.error.loading': 'Erro ao carregar os dados.',
                'priority.p0': 'P0 - Critical',
                'priority.p1': 'P1 - High',
                'priority.p2': 'P2 - Medium',
                'priority.p3': 'P3 - Low',
                'priority.none': 'Sem Prioridade',
                'priority.na': 'N/A'
            },
            en: {
                'nav.list': 'List',
                'nav.kanban': 'Kanban (Priorities)',
                'nav.milestones': 'Milestones',
                'nav.dashboard': 'Manager Dashboard',
                'nav.analytics': 'Charts & Metrics',
                'nav.theme.title': 'Toggle Dark Mode',
                'mslist.back': 'Back to Milestones Board',
                'mslist.loading.title': 'Loading Milestone...',
                'mslist.loading.issues': 'Fetching issues...',
                'mslist.col.issue': 'Issue',
                'mslist.col.title': 'Title',
                'mslist.col.type': 'Type',
                'mslist.col.priority': 'Current Priority',
                'mslist.col.changePriority': 'Change Priority',
                'mslist.none.selected': 'No milestone selected',
                'mslist.title.number': 'Milestone #{id}',
                'mslist.empty': 'No issues in this milestone.',
                'mslist.error.loading': 'Error loading data.',
                'priority.p0': 'P0 - Critical',
                'priority.p1': 'P1 - High',
                'priority.p2': 'P2 - Medium',
                'priority.p3': 'P3 - Low',
                'priority.none': 'No Priority',
                'priority.na': 'N/A'
            }
        };
    </script>
    <script src="/js/i18n.js"></script>
    <script>
        const priorities = [
            { value: 'priority:p0-critical', labelKey: 'priority.p0' },
            { value: 'priority:p1-high', labelKey: 'priority.p1' },
            { value: 'priority:p2-medium', labelKey: 'priority.p2' },
            { value: 'priority:p3-low', labelKey: 'priority.p3' },
            { value: 'none', labelKey: 'priority.none' }
        ];

        let lastIssuesData = [];
        let lastMsId = null;
        let lastCurrentMs = null;

        function getPriorityWeight(labels) {
            const hasLabel = (name) => labels.some(l => (typeof l === 'string' ? l : l.name) === name);
            if (hasLabel('priority:p0-critical')) return 4;
            if (hasLabel('priority:p1-high')) return 3;
            if (hasLabel('priority:p2-medium')) return 2;
            if (hasLabel('priority:p3-low')) return 1;
            return 0;
        }

        async function loadData() {
            const params = new URLSearchParams(window.location.search);
            const msId = params.get('id');
            lastMsId = msId;

            if (!msId) {
                document.getElementById('milestone-title').innerText = I18N.t('mslist.none.selected');
                document.getElementById('loading').style.display = 'none';
                return;
            }

            try {
                const [msRes, issRes] = await Promise.all([
                    fetch('/api/milestones'),
                    fetch('/api/issues')
                ]);
                
                const milestones = await msRes.json();
                let issues = await issRes.json();
                
                const currentMs = milestones.find(m => m.number == msId);
                lastCurrentMs = currentMs;
                if (currentMs) {
                    document.getElementById('milestone-title').innerText = `📦 ${currentMs.title}`;
                } else {
                    document.getElementById('milestone-title').innerText = I18N.t('mslist.title.number', { id: msId });
                }
                
                issues = issues.filter(issue => !issue.pull_request && issue.milestone && issue.milestone.number == msId);

                issues.sort((a, b) => {
                    const weightA = getPriorityWeight(a.labels || []);
                    const weightB = getPriorityWeight(b.labels || []);
                    if (weightA !== weightB) return weightB - weightA;

                    const isBugA = (a.labels || []).some(l => (typeof l === 'string' ? l : l.name) === 'type:bug') ? 1 : 0;
                    const isBugB = (b.labels || []).some(l => (typeof l === 'string' ? l : l.name) === 'type:bug') ? 1 : 0;
                    return isBugB - isBugA;
                });

                lastIssuesData = issues;
                renderIssues(issues);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('issuesTable').style.display = 'table';
            } catch (error) {
                document.getElementById('loading').innerText = I18N.t('mslist.error.loading');
                document.getElementById('loading').className = 'text-red-500 font-semibold mb-4';
            }
        }

        function renderIssues(issues) {
            const tbody = document.getElementById('issuesBody');
            tbody.innerHTML = '';

            if (issues.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center font-bold text-gray-500 dark:text-gray-400">${I18N.t('mslist.empty')}</td></tr>`;
                return;
            }

            issues.forEach(issue => {
                const labels = issue.labels || [];
                let currentPriorityValue = 'none';
                const priorityLabel = labels.find(l => (typeof l === 'string' ? l : l.name).startsWith('priority:'));
                if (priorityLabel) {
                    currentPriorityValue = typeof priorityLabel === 'string' ? priorityLabel : priorityLabel.name;
                }

                const typeLabel = labels.find(l => (typeof l === 'string' ? l : l.name).startsWith('type:'));
                const typeStr = typeLabel ? (typeof typeLabel === 'string' ? typeLabel : typeLabel.name).replace('type:', '') : '';
                const typeHtml = typeStr 
                    ? `<span class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-600 py-0.5 px-2 rounded text-[11px] font-semibold">${typeStr}</span>`
                    : `<span class="text-gray-400">-</span>`;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-blue-50/40 dark:hover:bg-gray-700/50 transition-colors';
                
                let optionsHtml = priorities.map(p =>
                    `<option value="${p.value}" ${p.value === currentPriorityValue ? 'selected' : ''}>${I18N.t(p.labelKey)}</option>`
                ).join('');

                tr.innerHTML = `
                    <td class="py-2.5 px-4 text-left whitespace-nowrap font-mono font-bold text-blue-600 dark:text-blue-400">#${issue.number}</td>
                    <td class="py-2.5 px-4 text-left">
                        <a href="${issue.html_url}" target="_blank" class="text-gray-900 dark:text-gray-100 hover:text-blue-600 dark:hover:text-blue-400 hover:underline font-medium">${escapeHtml(issue.title)}</a>
                    </td>
                    <td class="py-2.5 px-4 text-center whitespace-nowrap">${typeHtml}</td>
                    <td class="py-2.5 px-4 text-center whitespace-nowrap">
                        <span class="py-0.5 px-2.5 rounded text-[11px] font-bold ${getPriorityBadgeClass(currentPriorityValue)}">
                            ${getPriorityLabelName(currentPriorityValue)}
                        </span>
                    </td>
                    <td class="py-2.5 px-4 text-center whitespace-nowrap">
                        <div class="flex items-center justify-center gap-1.5">
                            <select onchange="updatePriority(${issue.number}, this.value, this)" 
                                    class="bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-gray-200 py-1 px-2 rounded text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none">
                                ${optionsHtml}
                            </select>
                            <span class="status-icon text-xs w-4"></span>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getPriorityLabelName(val) {
            const p = priorities.find(x => x.value === val);
            return p ? I18N.t(p.labelKey) : I18N.t('priority.na');
        }

        function getPriorityBadgeClass(val) {
            if (val === 'priority:p0-critical') return 'bg-gray-900 text-white dark:bg-gray-100 dark:text-gray-900';
            if (val === 'priority:p1-high') return 'bg-red-100 text-red-700 dark:bg-red-900/60 dark:text-red-300 border border-red-200 dark:border-red-800';
            if (val === 'priority:p2-medium') return 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/60 dark:text-yellow-300 border border-yellow-200 dark:border-yellow-800';
            if (val === 'priority:p3-low') return 'bg-green-100 text-green-700 dark:bg-green-900/60 dark:text-green-300 border border-green-200 dark:border-green-800';
            return 'bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-400';
        }

        async function updatePriority(issueNumber, newPriority, selectElement) {
            const statusSpan = selectElement.nextElementSibling;
            statusSpan.innerText = '⏳';
            selectElement.disabled = true;

            try {
                const res = await fetch(`/api/issues/${issueNumber}/priority`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newPriority })
                });

                if (res.ok) {
                    statusSpan.innerText = '✅';
                    setTimeout(() => statusSpan.innerText = '', 2000);
                    const badge = selectElement.closest('tr').querySelector('td:nth-child(4) span');
                    if (badge) {
                        badge.className = `py-0.5 px-2.5 rounded text-[11px] font-bold ${getPriorityBadgeClass(newPriority)}`;
                        badge.innerText = getPriorityLabelName(newPriority);
                    }
                } else {
                    statusSpan.innerText = '❌';
                }
            } catch (err) {
                statusSpan.innerText = '❌';
            } finally {
                selectElement.disabled = false;
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
                const icon = document.getElementById('theme-icon');
                if (icon) icon.className = 'fa-solid fa-sun text-yellow-400';
            } else {
                document.documentElement.classList.remove('dark');
                const icon = document.getElementById('theme-icon');
                if (icon) icon.className = 'fa-solid fa-moon text-yellow-200';
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const icon = document.getElementById('theme-icon');
            if (icon) icon.className = isDark ? 'fa-solid fa-sun text-yellow-400' : 'fa-solid fa-moon text-yellow-200';
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        initTheme();
        I18N.init();
        document.addEventListener('i18nchange', () => {
            if (!lastMsId) {
                document.getElementById('milestone-title').innerText = I18N.t('mslist.none.selected');
            } else if (lastCurrentMs) {
                document.getElementById('milestone-title').innerText = `📦 ${lastCurrentMs.title}`;
            } else {
                document.getElementById('milestone-title').innerText = I18N.t('mslist.title.number', { id: lastMsId });
            }
            renderIssues(lastIssuesData);
        });

        loadData();
    </script>
</body>
</html>
