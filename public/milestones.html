                darkMode: 'class'

                <a href="/kanban.html" class="hover:text-blue-200 dark:hover:text-blue-400" data-i18n="nav.kanban">Kanban (Prioridades)</a>
                <a href="/milestones.html" class="font-bold underline decoration-2 underline-offset-4 text-white" data-i18n="nav.milestones">Metas</a>
                <a href="/dashboard.html" class="hover:text-blue-200 dark:hover:text-blue-400" data-i18n="nav.dashboard">Dashboard Gestor</a>
                <a href="/analytics.html" class="hover:text-blue-200 dark:hover:text-blue-400" data-i18n="nav.analytics">Gráficos & Métricas</a>

                <!-- Seletor de Idioma -->

                <!-- Toggle Dark Mode -->
                <button id="theme-toggle" onclick="toggleDarkMode()" class="p-2 rounded-lg bg-blue-700 dark:bg-gray-700 hover:bg-blue-800 dark:hover:bg-gray-600 text-yellow-300 dark:text-yellow-400 text-xs focus:outline-none" data-i18n-title="nav.theme.title" title="Alternar Modo Escuro">

    <!-- Top Toolbar -->

        <div class="flex flex-wrap justify-between items-center mb-3 flex-shrink-0 gap-3">
            <div>
                <h1 class="text-xl font-extrabold text-gray-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-flag text-blue-600 dark:text-blue-400"></i>
                    <span data-i18n="milestones.header.title">Quadro de Metas</span>
                </h1>
                <p class="text-xs text-gray-500 dark:text-gray-400" data-i18n="milestones.header.subtitle">
                    Arraste colunas para reordenar metas ativas e issues para reagendar entre metas.
                </p>
            </div>

            <div class="flex items-center gap-3">
                <label class="flex items-center gap-1.5 text-xs text-gray-600 dark:text-gray-300 cursor-pointer select-none">
                    <input type="checkbox" id="toggle-show-closed" onchange="toggleShowClosed(this.checked)" class="rounded text-blue-600 dark:bg-gray-700 border-gray-300">
                    <span data-i18n="milestones.toggle.showclosed">Exibir metas concluídas</span>
                </label>

                <span id="order-save-status" class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 transition-opacity opacity-0">
                    <i class="fa-solid fa-check mr-1"></i> <span data-i18n="milestones.order.saved">Ordem das metas salva!</span>
                </span>

                <button onclick="openCreateMilestoneModal()" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-xs transition-colors">
                    <i class="fa-solid fa-plus text-[11px]"></i>
                    <span data-i18n="milestones.create.btn">Nova Meta</span>
                </button>
            </div>
        </div>

            <i class="fa-solid fa-spinner fa-spin"></i> <span data-i18n="milestones.loading">Carregando metas e issues...</span>
        </div>

        <div id="milestones-board" class="flex gap-4 overflow-x-auto pb-4 items-start flex-1" style="display: none;">
            <!-- Gerado via JS -->

    <!-- MODAL DE CRIAÇÃO DE MILESTONE -->
    <div id="modal-create-milestone" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 max-w-md w-full overflow-hidden transition-all">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700">
                <h3 class="text-sm font-bold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                    <i class="fa-solid fa-flag text-blue-600 dark:text-blue-400"></i>
                    <span data-i18n="milestones.create.modal.title">Nova Milestone no GitHub</span>
                </h3>
                <button onclick="closeCreateMilestoneModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form onsubmit="submitCreateMilestone(event)" class="p-5 space-y-4 text-xs">
                <div>
                    <label class="block font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="milestones.field.title">Título da Milestone *</label>
                    <input type="text" id="create-ms-title" required data-i18n-ph="milestones.create.title.ph" placeholder="Ex: Sprint 14 - Novo Módulo" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="milestones.field.due.optional">Data de Conclusão / Prazo (Opcional)</label>
                    <input type="date" id="create-ms-due" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="milestones.field.desc.optional">Descrição (Opcional)</label>
                    <textarea id="create-ms-desc" rows="3" data-i18n-ph="milestones.create.desc.ph" placeholder="Objetivos e escopo planejado para esta entrega..." class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 text-xs"></textarea>
                </div>
                <div class="pt-2 flex justify-end gap-2 border-t border-gray-200 dark:border-gray-700">
                    <button type="button" onclick="closeCreateMilestoneModal()" class="px-3 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-semibold" data-i18n="milestones.cancel">Cancelar</button>
                    <button type="submit" id="btn-submit-create" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold flex items-center gap-1.5">
                        <i class="fa-solid fa-plus text-[10px]"></i> <span data-i18n="milestones.create.submit">Criar Milestone</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

                    <span data-i18n="milestones.edit.modal.title">Editar Milestone</span> <span id="edit-ms-number" class="text-blue-500"></span>
                </h3>
                <button onclick="closeEditMilestoneModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form onsubmit="submitEditMilestone(event)" class="p-5 space-y-4 text-xs">
                <input type="hidden" id="edit-ms-target-number">
                <div>
                    <label class="block font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="milestones.field.title.required">Título *</label>
                    <input type="text" id="edit-ms-title" required class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 text-xs">

                <div>
                    <label class="block font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="milestones.field.status">Status</label>

                        <option value="closed" data-i18n="milestones.state.closed">Fechada (Concluída)</option>

                </div>
                <div>
                    <label class="block font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="milestones.field.due">Data de Conclusão / Prazo</label>
                    <input type="date" id="edit-ms-due" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 dark:text-gray-300 mb-1" data-i18n="milestones.field.desc">Descrição</label>
                    <textarea id="edit-ms-desc" rows="3" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 text-xs"></textarea>
                </div>
                <div class="pt-2 flex justify-end gap-2 border-t border-gray-200 dark:border-gray-700">
                    <button type="button" onclick="closeEditMilestoneModal()" class="px-3 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 font-semibold" data-i18n="milestones.cancel">Cancelar</button>
                    <button type="submit" id="btn-submit-edit" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold flex items-center gap-1.5">
                        <i class="fa-solid fa-floppy-disk text-[10px]"></i> <span data-i18n="milestones.edit.submit">Salvar Alterações</span>
                    </button>
                </div>
            </form>

    <script src="/js/i18n.js"></script>
    <script>
        let milestones = [];
        let issues = [];

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
                const icon = document.getElementById('theme-icon');
                if (icon) icon.className = 'fa-solid fa-sun text-yellow-400';
            } else {
                document.documentElement.classList.remove('dark');
                const icon = document.getElementById('theme-icon');
                if (icon) icon.className = 'fa-solid fa-moon text-yellow-200';
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const icon = document.getElementById('theme-icon');
            if (icon) icon.className = isDark ? 'fa-solid fa-sun text-yellow-400' : 'fa-solid fa-moon text-yellow-200';
        }

        let showClosedMilestones = false;

        function toggleShowClosed(checked) {
            showClosedMilestones = checked;
            renderBoard();
        }

        initTheme();
        I18N.init();
        document.addEventListener('i18nchange', () => {
            if (document.getElementById('milestones-board').style.display !== 'none') {
                renderBoard();
            }
        });

        async function loadData() {
            try {
                const [msRes, issRes] = await Promise.all([
                    fetch('/api/milestones?state=all'),
                    fetch('/api/issues')
                ]);
                milestones = await msRes.json();
                issues = await issRes.json();
                
                issues = issues.filter(issue => !issue.pull_request);
                renderBoard();
            } catch (error) {
                document.getElementById('loading').innerText = I18N.t('milestones.loading.error');
                document.getElementById('loading').className = 'text-red-500 font-semibold mb-4';
            }
        }

        function renderBoard() {
            const board = document.getElementById('milestones-board');
            board.innerHTML = '';

            // Coluna Backlog (Sem Milestone)
            board.appendChild(createBacklogColumn());

            // Filtra milestones fechadas caso a flag esteja desativada
            const visibleMilestones = milestones.filter(ms => {
                if (showClosedMilestones) return true;
                return ms.state !== 'closed';
            });

            // Colunas para cada Milestone com dados completos
            visibleMilestones.forEach(ms => {
                board.appendChild(createMilestoneColumn(ms));
            });

            // Distribui as issues
            issues.forEach(issue => {
                const msNumber = issue.milestone ? issue.milestone.number : 'none';
                const col = document.getElementById(`col-ms-${msNumber}`);
                if (col) {
                    col.appendChild(createCard(issue));
                }
            });

            document.getElementById('loading').style.display = 'none';
            board.style.display = 'flex';

            initSortable();
        }

        function createBacklogColumn() {
            const div = document.createElement('div');
            div.className = 'w-80 flex-shrink-0 rounded-xl flex flex-col bg-gray-100 dark:bg-gray-800/90 border border-gray-200 dark:border-gray-700 milestone-col h-full shadow-sm overflow-hidden';
            div.dataset.milestoneNumber = 'null';
            div.innerHTML = `
                <div class="bg-gray-200 dark:bg-gray-700 p-3 flex justify-between items-center cursor-move col-handle flex-shrink-0 border-b border-gray-200 dark:border-gray-600">
                    <h3 class="text-gray-900 dark:text-gray-100 font-bold text-xs uppercase tracking-wider truncate pr-2 flex items-center gap-1.5">
                        <i class="fa-solid fa-inbox text-gray-500"></i>
                        <span>${I18N.t('milestones.backlog.title')}</span>
                    </h3>
                </div>
                <div class="p-2.5 bg-gray-50/50 dark:bg-gray-800/50 border-b border-gray-200 dark:border-gray-700 text-[11px] text-gray-500 dark:text-gray-400">
                    ${I18N.t('milestones.backlog.subtitle')}
                </div>
                <div id="col-ms-none" data-milestone="null" class="flex-1 p-2 kanban-col overflow-y-auto space-y-2"></div>
            `;
            return div;
        }

        function createMilestoneColumn(ms) {
            const totalIssues = (ms.open_issues || 0) + (ms.closed_issues || 0);
            const closedIssues = ms.closed_issues || 0;
            const pct = totalIssues > 0 ? Math.round((closedIssues / totalIssues) * 100) : 0;

            let dueHtml = `<span class="text-[10px] text-gray-400">${I18N.t('milestones.due.none')}</span>`;
            if (ms.due_on) {
                const dueDate = new Date(ms.due_on);
                const isPast = dueDate < new Date() && ms.state === 'open';
                const dateLocale = I18N.lang === 'pt' ? 'pt-BR' : 'en-US';
                const formattedDate = dueDate.toLocaleDateString(dateLocale);
                if (isPast) {
                    dueHtml = `<span class="inline-flex items-center gap-1 text-[10px] font-bold text-red-600 dark:text-red-400 bg-red-100 dark:bg-red-950/60 px-1.5 py-0.5 rounded"><i class="fa-solid fa-triangle-exclamation text-[9px]"></i> ${formattedDate} ${I18N.t('milestones.due.overdue')}</span>`;
                } else {
                    dueHtml = `<span class="inline-flex items-center gap-1 text-[10px] font-medium text-emerald-700 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-950/60 px-1.5 py-0.5 rounded"><i class="fa-regular fa-calendar-check text-[9px]"></i> ${formattedDate}</span>`;
                }
            }

            const div = document.createElement('div');
            div.className = 'w-80 flex-shrink-0 rounded-xl flex flex-col bg-blue-50/50 dark:bg-gray-800/90 border border-gray-200 dark:border-gray-700 milestone-col h-full shadow-sm overflow-hidden transition-all';
            div.dataset.milestoneNumber = String(ms.number);

            div.innerHTML = `
                <div class="bg-blue-100/80 dark:bg-blue-950/70 p-3 flex justify-between items-center cursor-move col-handle flex-shrink-0 border-b border-gray-200 dark:border-gray-700">
                    <div class="flex items-center gap-1.5 min-w-0 pr-1">
                        <i class="fa-solid fa-flag text-blue-600 dark:text-blue-400 text-xs"></i>
                        <h3 class="text-gray-900 dark:text-gray-100 font-bold text-xs uppercase tracking-wider truncate" title="${escapeHtml(ms.title)}">${escapeHtml(ms.title)}</h3>
                    </div>
                    <div class="flex items-center gap-1.5 flex-shrink-0">
                        <button type="button" onclick="openEditMilestoneModal(${ms.number})" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 p-1 rounded hover:bg-white dark:hover:bg-gray-700 transition" title="${I18N.t('milestones.edit.title.attr')}">
                            <i class="fa-solid fa-pen-to-square text-[11px]"></i>
                        </button>
                        <a href="/milestone-list.html?id=${ms.number}" class="text-[10px] font-semibold bg-white dark:bg-gray-700 text-blue-600 dark:text-blue-300 px-2 py-0.5 rounded shadow-2xs hover:bg-gray-50 dark:hover:bg-gray-600 transition whitespace-nowrap">
                            ${I18N.t('milestones.list.link')}
                        </a>
                    </div>
                </div>

                <!-- Info, Progresso e Prazo -->
                <div class="p-3 bg-white/70 dark:bg-gray-800/70 border-b border-gray-200 dark:border-gray-700 space-y-2">
                    <div class="flex items-center justify-between text-[11px]">
                        <span class="font-bold text-gray-700 dark:text-gray-300 flex items-center gap-1">
                            <span>${I18N.t('milestones.progress.label')}</span>
                            <span class="text-blue-600 dark:text-blue-400 font-extrabold">${pct}%</span>
                        </span>
                        <span class="text-gray-500 dark:text-gray-400 text-[10px]">
                            ${I18N.t('milestones.progress.done', { closed: closedIssues, total: totalIssues })}
                        </span>
                    </div>

                    <!-- Barra de Progresso Visual -->
                    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 overflow-hidden">
                        <div class="bg-gradient-to-r from-blue-500 to-emerald-500 h-2 rounded-full transition-all duration-300" style="width: ${pct}%"></div>
                    </div>

                    <div class="flex items-center justify-between pt-0.5">
                        <div>${dueHtml}</div>
                        ${ms.state === 'closed' ? `<span class="text-[9px] uppercase px-1.5 py-0.2 rounded font-bold bg-purple-100 dark:bg-purple-900/60 text-purple-700 dark:text-purple-300">${I18N.t('milestones.state.closed.badge')}</span>` : ''}
                    </div>

                    ${ms.description ? `
                        <p class="text-[11px] text-gray-500 dark:text-gray-400 line-clamp-2 leading-tight pt-1 border-t border-gray-100 dark:border-gray-700/50" title="${escapeHtml(ms.description)}">
                            ${escapeHtml(ms.description)}
                        </p>
                    ` : ''}
                </div>

                <!-- Lista de Issues -->
                <div id="col-ms-${ms.number}" data-milestone="${ms.number}" class="flex-1 p-2 kanban-col overflow-y-auto space-y-2"></div>
            `;
            return div;
        }

        function createCard(issue) {
            const card = document.createElement('div');
            card.className = 'bg-white dark:bg-gray-800 p-2.5 rounded-lg shadow-2xs cursor-grab border border-gray-200 dark:border-gray-700 border-l-3 border-l-indigo-500 hover:border-indigo-400 transition-all select-none';
            card.dataset.id = issue.number;

            card.innerHTML = `
                <div class="flex justify-between items-start mb-1 pointer-events-none">
                    <span class="text-[11px] font-mono text-blue-600 dark:text-blue-400 font-bold">#${issue.number}</span>
                    ${issue.state === 'closed' ? `<span class="text-[9px] px-1 py-0.2 rounded bg-green-100 dark:bg-green-900/60 text-green-700 dark:text-green-300 font-bold">${I18N.t('milestones.issue.closed')}</span>` : ''}
                </div>
                <a href="${issue.html_url}" target="_blank" class="text-xs font-semibold text-gray-800 dark:text-gray-200 hover:text-blue-600 dark:hover:text-blue-400 line-clamp-2 leading-tight">${escapeHtml(issue.title)}</a>
                <div class="mt-1 text-[10px] text-gray-400 update-status pointer-events-none"></div>
            `;
            return card;
        }

        function initSortable() {
            // Sortable para as colunas de Milestones (reordenação de colunas)
            new Sortable(document.getElementById('milestones-board'), {
                animation: 150,
                handle: '.col-handle',
                ghostClass: 'opacity-40',
                onEnd: async function () {
                    const cols = Array.from(document.querySelectorAll('#milestones-board .milestone-col[data-milestone-number]'));
                    const order = cols.map(c => c.dataset.milestoneNumber).filter(n => n && n !== 'null');
                    
                    try {
                        const res = await fetch('/api/milestones/order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ order })
                        });
                        if (res.ok) {
                            showOrderSavedBadge();
                        }
                    } catch (e) {
                        console.error(I18N.t('milestones.order.save.error'), e);
                    }
                }
            });

            // Sortable para as issues entre as colunas
            const columns = document.querySelectorAll('.kanban-col');
            columns.forEach(col => {
                new Sortable(col, {
                    group: 'milestones',
                    animation: 150,
                    ghostClass: 'bg-indigo-50',
                    onEnd: async function (evt) {
                        const itemEl = evt.item;
                        const toList = evt.to;
                        const issueNumber = itemEl.dataset.id;
                        let newMilestone = toList.dataset.milestone;
                        if (newMilestone === 'null') newMilestone = null;

                        const statusEl = itemEl.querySelector('.update-status');
                        if (evt.from === evt.to) return; 

                        statusEl.innerText = I18N.t('milestones.card.moving');
                        statusEl.className = 'mt-1 text-[10px] text-blue-500 font-semibold';

                        try {
                            const res = await fetch(`/api/issues/${issueNumber}/milestone`, {
                                method: 'PATCH',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ milestone: newMilestone ? parseInt(newMilestone) : null })
                            });

                            if (res.ok) {
                                statusEl.innerText = I18N.t('milestones.card.moved');
                                statusEl.className = 'mt-1 text-[10px] text-green-500 font-semibold';
                                setTimeout(() => statusEl.innerText = '', 2000);
                            } else {
                                statusEl.innerText = I18N.t('milestones.card.move.error');
                                statusEl.className = 'mt-1 text-[10px] text-red-500 font-semibold';
                            }
                        } catch (err) {
                            statusEl.innerText = I18N.t('milestones.card.move.error');
                            statusEl.className = 'mt-1 text-[10px] text-red-500 font-semibold';
                        }
                    }
                });
            });
        }

        function showOrderSavedBadge() {
            const badge = document.getElementById('order-save-status');
            if (!badge) return;
            badge.classList.remove('opacity-0');
            badge.classList.add('opacity-100');
            setTimeout(() => {
                badge.classList.remove('opacity-100');
                badge.classList.add('opacity-0');
            }, 2500);
        }

        // Modais de Criação e Edição
        function openCreateMilestoneModal() {
            document.getElementById('create-ms-title').value = '';
            document.getElementById('create-ms-desc').value = '';
            document.getElementById('create-ms-due').value = '';
            document.getElementById('modal-create-milestone').style.display = 'flex';
        }

        function closeCreateMilestoneModal() {
            document.getElementById('modal-create-milestone').style.display = 'none';
        }

        async function submitCreateMilestone(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-create');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${I18N.t('milestones.create.submitting')}`;

            const title = document.getElementById('create-ms-title').value.trim();
            const description = document.getElementById('create-ms-desc').value.trim();
            const dueVal = document.getElementById('create-ms-due').value;
            const due_on = dueVal ? new Date(dueVal + 'T23:59:59Z').toISOString() : null;

            try {
                const res = await fetch('/api/milestones', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, due_on })
                });

                if (res.ok) {
                    closeCreateMilestoneModal();
                    await loadData();
                } else {
                    const err = await res.json();
                    alert(I18N.t('milestones.create.error', { msg: err.error || I18N.t('milestones.error.unknown') }));
                }
            } catch (err) {
                alert(I18N.t('milestones.create.network.error', { msg: err.message }));
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-plus text-[10px]"></i> ${I18N.t('milestones.create.submit')}`;
            }
        }

        function openEditMilestoneModal(msNumber) {
            const ms = milestones.find(m => m.number == msNumber);
            if (!ms) return;

            document.getElementById('edit-ms-target-number').value = ms.number;
            document.getElementById('edit-ms-number').innerText = `#${ms.number}`;
            document.getElementById('edit-ms-title').value = ms.title || '';
            document.getElementById('edit-ms-desc').value = ms.description || '';
            document.getElementById('edit-ms-state').value = ms.state || 'open';

            if (ms.due_on) {
                const d = new Date(ms.due_on);
                document.getElementById('edit-ms-due').value = d.toISOString().slice(0, 10);
            } else {
                document.getElementById('edit-ms-due').value = '';
            }

            document.getElementById('modal-edit-milestone').style.display = 'flex';
        }

        function closeEditMilestoneModal() {
            document.getElementById('modal-edit-milestone').style.display = 'none';
        }

        async function submitEditMilestone(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-edit');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${I18N.t('milestones.edit.submitting')}`;

            const number = document.getElementById('edit-ms-target-number').value;
            const title = document.getElementById('edit-ms-title').value.trim();
            const description = document.getElementById('edit-ms-desc').value.trim();
            const state = document.getElementById('edit-ms-state').value;
            const dueVal = document.getElementById('edit-ms-due').value;
            const due_on = dueVal ? new Date(dueVal + 'T23:59:59Z').toISOString() : null;

            try {
                const res = await fetch(`/api/milestones/${number}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, state, due_on })
                });

                if (res.ok) {
                    closeEditMilestoneModal();
                    await loadData();
                } else {
                    const err = await res.json();
                    alert(I18N.t('milestones.edit.error', { msg: err.error || I18N.t('milestones.error.unknown') }));
                }
            } catch (err) {
                alert(I18N.t('milestones.edit.network.error', { msg: err.message }));
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-floppy-disk text-[10px]"></i> ${I18N.t('milestones.edit.submit')}`;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeCreateMilestoneModal();
                closeEditMilestoneModal();
            }
        });

        loadData();
    </script>
</body>
</html>
